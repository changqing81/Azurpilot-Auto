<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AzurPilot</title>
    <!-- 12 个老 UI 样式表合并为一个响应（/newapi/bundle.css）：
         浏览器原本要等 12 个渲染阻塞请求串行下完才画第一帧；合并后只剩 1 个往返。
         合并顺序与原 <link> 顺序完全一致（见 module/webapi/data.py:_BUNDLE_CSS_FILES），
         层叠优先级不变。主题层（light/dark/…）仍单独由 /newapi/theme-css 动态注入。 -->
    <link rel="stylesheet" href="/newapi/bundle.css" />
    <!-- 默认主题层（运行时按 deploy.yaml Theme 追加对应的 dark/advanced-material/transparent） -->
    <link rel="stylesheet" href="/static/assets/gui/css/light-alas.css?v=newui" />
    <!-- 首屏骨架：SPA 必须等 JS 下载+解析+React 挂载才画，实测 FCP 比服务端直出的
         老 UI 慢约 400ms。把骨架内联在 index.html 里（CSS+HTML 都在文档流内），
         浏览器解析到就能画——FCP 回到 100ms 级，React 挂载后由 app 代码移除。
         结构与老 UI 的 #alas-page-skeleton 语义一致（title + 递减宽度线条）。 -->
    <style>
      /* 骨架按真实壳层形态摆位：左侧窄栏（对应 aside+menu）+ 内容区卡片，
         避免加载瞬间看到一个与最终布局无关的方块。 */
      html, body { background: #f9f9f9; margin: 0; }
      #alas-boot-skeleton {
        display: grid; grid-template-columns: 264px 1fr;
        position: fixed; inset: 50px 0 0 0; background: #f9f9f9;
      }
      #alas-boot-skeleton .sk-rail { background: #fff; border-right: 1px solid #eee; }
      #alas-boot-skeleton .sk-card {
        margin: .625rem; padding: 1rem 1.25rem; border-radius: 16px;
        background: #fff; border: 1px solid #e0e0e0; align-self: start;
      }
      #alas-boot-skeleton .sk-title {
        width: 32%; height: 20px; border-radius: 6px; margin-bottom: 12px;
        background: linear-gradient(90deg, #eef0f4 25%, #f7f8fa 50%, #eef0f4 75%);
        background-size: 200% 100%; animation: sk-shimmer 1.2s ease-in-out infinite;
      }
      #alas-boot-skeleton .sk-line {
        height: 12px; border-radius: 6px; margin: 8px 0;
        background: linear-gradient(90deg, #eef0f4 25%, #f7f8fa 50%, #eef0f4 75%);
        background-size: 200% 100%; animation: sk-shimmer 1.2s ease-in-out infinite;
      }
      /* FCP 只统计「文本或图像」的首次绘制，纯色块不算 contentful paint。
         所以骨架里必须有一段真实文字，否则 FCP 仍要等到 React 渲染完。 */
      #alas-boot-skeleton .sk-text {
        font: 500 14px/1.5 'MiSans', 'Microsoft YaHei', sans-serif;
        color: #7a7a8c; margin-bottom: 14px;
      }
      @keyframes sk-shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
      /* React 挂载完成的标记：root 有子节点时骨架自动退场（纯 CSS，无需 JS） */
      body:has(#root > div) #alas-boot-skeleton { display: none; }
    </style>
  </head>
  <body class="webio-theme-default no-animation">
    <div id="root"></div>
    <div id="alas-boot-skeleton" aria-hidden="true">
      <div class="sk-rail"></div>
      <div class="sk-card">
        <div class="sk-text">正在加载 AzurPilot…</div>
        <div class="sk-title"></div>
        <div class="sk-line" style="width:88%"></div>
        <div class="sk-line" style="width:77%"></div>
        <div class="sk-line" style="width:66%"></div>
        <div class="sk-line" style="width:55%"></div>
        <div class="sk-line" style="width:44%"></div>
        <div class="sk-line" style="width:33%"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
