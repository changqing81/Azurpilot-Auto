name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      # pyproject 里的国内 PyPI 镜像从海外 runner 访问经常超时（cernet/hust
      # 反复把 uv sync 卡死）。CI 统一走官方 PyPI：临时删掉镜像 index 行，
      # 本地用户不受影响（仓库内 pyproject 原样保留）。
      - name: Install dependencies
        run: |
          sed -i '/mirrors\.aliyun\.com/d;/mirrors\.cloud\.tencent\.com/d;/repo\.huaweicloud\.com/d;/mirrors\.cernet\.edu\.cn/d' pyproject.toml
          uv sync
      - name: Run ruff
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722

  button-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          sed -i '/mirrors\.aliyun\.com/d;/mirrors\.cloud\.tencent\.com/d;/repo\.huaweicloud\.com/d;/mirrors\.cernet\.edu\.cn/d' pyproject.toml
          uv sync --no-dev
      - name: Run button_extract
        run: uv run -m dev_tools.button_extract
      - name: Run config_updater
        run: uv run -m module.config.config_updater
      - name: Check for differences
        run: |
          # 还原依赖安装阶段对 pyproject / uv.lock 的临时修改，避免污染产物 diff 检查。
          # sed 删除镜像 index 后 uv 判定锁过期，sync 会把 uv.lock 重写为官方源版本。
          git checkout -- pyproject.toml uv.lock
          git diff --exit-code

  call-signature-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 纯标准库实现，不需要 uv sync，跑一次约 10 秒
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 全仓调用签名自检
        run: python dev_tools/audit_call_kwargs.py

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          sed -i '/mirrors\.aliyun\.com/d;/mirrors\.cloud\.tencent\.com/d;/repo\.huaweicloud\.com/d;/mirrors\.cernet\.edu\.cn/d' pyproject.toml
          uv sync
      - name: Run unittest
        run: uv run python -m unittest discover -s tests
