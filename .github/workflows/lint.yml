name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync
      - name: Run ruff
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722

  button-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Run button_extract
        run: uv run -m dev_tools.button_extract
      - name: Run config_updater
        run: uv run -m module.config.config_updater
      - name: Check for differences
        run: |
          git diff --exit-code

  call-signature-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 纯标准库实现，不需要 uv sync，跑一次约 10 秒
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 全仓调用签名自检
        run: python dev_tools/audit_call_kwargs.py

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync
      - name: Run unittest
        run: uv run python -m unittest discover -s tests

  frontend:
    name: React 前端与 API 契约检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install system libs for python imports
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1
      - name: Install dependencies
        run: |
          uv sync
          npm ci --prefix frontend
      - name: 校验 API 契约
        run: |
          uv run python -m dev_tools.export_api_schema
          git diff --exit-code -- frontend/src/api/generated.ts frontend/src/api/contract.json
      - name: Build and test frontend
        run: |
          npm run build --prefix frontend
          npm test --prefix frontend
