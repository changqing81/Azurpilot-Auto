name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      # pyproject 里的国内 PyPI 镜像从海外 runner 访问经常超时（cernet/hust
      # 反复把 uv sync 卡死）。CI 统一走官方 PyPI：临时删掉镜像 index 行，
      # 本地用户不受影响（仓库内 pyproject 原样保留）。
      - name: Install dependencies
        run: |
          sed -i '/mirrors\.aliyun\.com/d;/mirrors\.cloud\.tencent\.com/d;/repo\.huaweicloud\.com/d;/mirrors\.cernet\.edu\.cn/d' pyproject.toml
          uv sync
      - name: Run ruff
        run: uv run ruff check . --select E9,F63,F7,F82 --ignore F821,F722

  button-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          sed -i '/mirrors\.aliyun\.com/d;/mirrors\.cloud\.tencent\.com/d;/repo\.huaweicloud\.com/d;/mirrors\.cernet\.edu\.cn/d' pyproject.toml
          uv sync --no-dev
      - name: Run button_extract
        run: uv run -m dev_tools.button_extract
      - name: Run config_updater
        run: uv run -m module.config.config_updater
      - name: Check for differences
        run: |
          # 还原依赖安装阶段对 pyproject / uv.lock 的临时修改，避免污染产物 diff 检查。
          # sed 删除镜像 index 后 uv 判定锁过期，sync 会把 uv.lock 重写为官方源版本。
          git checkout -- pyproject.toml uv.lock
          git diff --exit-code

  frontend-dist-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 方案 A（2026-11-19）：frontend/dist 入库，随 git 分发到启动器/CND 用户。
      # 代价是必须保证「入库产物 = 当前源码构建出来」，
      # 否则有人改了 React 源码忘了 pnpm build，所有用户拿到的还是旧 UI。
      # 这里用同一份 lockfile 重新构建，产物与仓库里的逐字节比对。
      # 之所以能逐字节比：vite.config.ts 的缓存破坏参数已从 Date.now()
      # 改成「主题 CSS 内容哈希」，构建因此可复现。
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
      - name: Verify committed dist matches source
        run: |
          if [ -n "$(git status --porcelain frontend/dist)" ]; then
            echo ""
            echo "::error::frontend/dist 与源码不一致 —— 改了前端却忘了提交构建产物。"
            echo ""
            echo "本地执行："
            echo "  cd frontend && pnpm build && cd .."
            echo "  git add frontend/dist && git commit"
            echo ""
            echo "差异文件："
            git status --porcelain frontend/dist
            echo ""
            git --no-pager diff --stat frontend/dist || true
            exit 1
          fi
          echo "frontend/dist 与源码一致 ✓"

  call-signature-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 纯标准库实现，不需要 uv sync，跑一次约 10 秒
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 全仓调用签名自检
        run: python dev_tools/audit_call_kwargs.py

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          sed -i '/mirrors\.aliyun\.com/d;/mirrors\.cloud\.tencent\.com/d;/repo\.huaweicloud\.com/d;/mirrors\.cernet\.edu\.cn/d' pyproject.toml
          uv sync
      - name: Run unittest
        run: uv run python -m unittest discover -s tests
