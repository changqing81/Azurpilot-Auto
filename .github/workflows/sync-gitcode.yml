name: Sync to GitCode

# 把 master / dev 同步到 gitcode 仓库（国内用户的代码更新源）。
# 背景：gitcode 仓库已取消平台导入镜像（2026-10-06），代码不会自动跟随
# GitHub，需要这里主动推送；客户启动器默认从
# https://gitcode.com/gcw_BYvq9jGu/AzurPilot 拉取 master 分支。
# 需要密钥 GITCODE_TOKEN（兼容小写 gitcode）；未配置时打印提示并跳过。

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 只需最新端：gitcode 镜像已是孤儿快照仓库（2026-11-14 历史重置），
          # 每次同步都推「无父快照提交」而不是完整历史，仓库体积不再增长。
          # 浅克隆即足够（快照推的是单提交，无历史可补）。
          fetch-depth: 1

      - name: Push to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN || secrets.gitcode }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "GITCODE_TOKEN 未配置，跳过 GitCode 同步"
            exit 0
          fi
          # 把当前 HEAD 转成孤儿快照：树不变、丢掉父链，gitcode 仓库只保留最新端
          TREE=$(git log -1 --format='%T')
          SNAPSHOT=$(git commit-tree "$TREE" -m "sync: mirror snapshot of ${GITHUB_SHA::7} (branch ${BRANCH})")
          git push --force \
            "https://gcw_BYvq9jGu:${GITCODE_TOKEN}@gitcode.com/gcw_BYvq9jGu/AzurPilot.git" \
            "${SNAPSHOT}:refs/heads/${BRANCH}"
          echo "已同步 ${BRANCH} 到 GitCode（快照模式，无历史）"
