<div class="opsi-meow-card">
  <div class="opsi-meow-side">
    <div class="opsi-meow-head">
      <span class="opsi-meow-badge" style="background:{badge_bg}">{level}</span>
      <b class="opsi-meow-name">{level_label}</b>
      <span class="opsi-meow-month">{month}</span>
    </div>
    <div class="opsi-meow-scale">
      <div class="opsi-meow-scale-item">
        <span class="opsi-meow-scale-label">{battles_label}</span>
        <b class="opsi-meow-scale-value">{battles}</b>
      </div>
      <div class="opsi-meow-scale-item">
        <span class="opsi-meow-scale-label">{rounds_label}</span>
        <b class="opsi-meow-scale-value">{rounds}</b>
      </div>
    </div>
  </div>
  <div class="opsi-meow-grid">
    {cells}
  </div>
</div>
