<div class="opsi-summary">
  <div class="opsi-net">
    <div class="opsi-net-label">{net_label}</div>
    <div class="opsi-net-value">{net_value}</div>
    <div class="opsi-net-bars">
      <div class="opsi-bar">
        <div class="opsi-bar-head"><span>{bought_label}</span><b>{bought_value}</b></div>
        <span class="opsi-bar-track"><span class="opsi-bar-fill" style="width:{bought_pct}%"></span></span>
      </div>
      <div class="opsi-bar">
        <div class="opsi-bar-head"><span>{cost_label}</span><b class="is-cost">{cost_value}</b></div>
        <span class="opsi-bar-track"><span class="opsi-bar-fill is-cost" style="width:{cost_pct}%"></span></span>
      </div>
    </div>
    <div class="opsi-net-meta">
      <div class="opsi-net-line"><span>{loop_label}</span><b>{loop_value}</b></div>
      <div class="opsi-net-line"><span>{ratio_label}</span><b class="is-net">{ratio_value}</b></div>
    </div>
    <div class="opsi-net-source">{month} · {source}</div>
  </div>
  <div class="opsi-grid">{cards}</div>
</div>
