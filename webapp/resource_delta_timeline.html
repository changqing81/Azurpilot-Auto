<div class="rd-block">
  <div class="rd-section-title">{title}</div>
  <div class="rd-stats-row" id="{chart_id}_stats_row">{stats_html}</div>
  <div class="rd-legend" id="{chart_id}_legend">{legend_html}</div>
  <div class="rd-canvas-wrap rd-panel" id="{chart_id}_container">
    <canvas id="{chart_id}" class="rd-canvas"></canvas>
    <div id="{chart_id}_tip" class="rd-tip"></div>
    <div class="rd-controls">
      <button id="{chart_id}_zoom_in" class="rd-btn">+</button>
      <button id="{chart_id}_zoom_out" class="rd-btn">-</button>
      <button id="{chart_id}_reset" class="rd-btn">重置</button>
    </div>
  </div>
</div>
