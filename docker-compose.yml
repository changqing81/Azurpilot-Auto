services:
    ALAS:
        container_name: "alas"
        # 官方预构建镜像（推荐）：docker compose pull && docker compose up -d
        image: "ghcr.io/changqing81/azurpilot-auto:latest"
        # 本地构建（内网隔离 / 自定义依赖用户）：取消下面注释，然后
        #   docker compose build --pull && docker compose up -d
        # 若自行修改了依赖，请先在仓库根执行 `uv lock` 更新 uv.lock 再构建
        # build:
        #     context: .
        #     dockerfile: ./deploy/docker/Dockerfile
        #     args:
        #         UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        #         UV_EXTRA_INDEX_URL: ${UV_EXTRA_INDEX_URL:-}
        network_mode: host
        restart: unless-stopped
        init: true
        working_dir: /app/AzurPilot
        environment:
            TZ: ${TZ:-Asia/Shanghai}
            PYTHONDONTWRITEBYTECODE: "1"
            PYTHONUNBUFFERED: "1"
        volumes:
            - '.:/app/AzurPilot:rw'
            - 'alas-venv:/app/AzurPilot/.venv'
            # - '../MAA:/app/MAA:rw'
            - '/etc/localtime:/etc/localtime:ro'
        command: [".venv/bin/python", "gui.py"]
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    ".venv/bin/python -c \"import socket; s=socket.create_connection(('127.0.0.1', 25548), 3); s.close()\"",
                ]
            interval: 30s
            timeout: 5s
            retries: 6
            start_period: 90s

volumes:
    alas-venv:
